[project]
name = "bilibili-ma-provider"
version = "0.1.0a0"
description = "Bilibili video audio as a Music Assistant music provider (unofficial)"
requires-python = ">=3.14"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that hit the real Bilibili API (excluded by default)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".refs", ".dev-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
