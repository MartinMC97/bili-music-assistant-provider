name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
    inputs:
      ma_version:
        description: "MA base image tag; leave empty to use repository variable MA_VERSION (fallback 2.10.8)"
        required: false

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/music-assistant

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platforms }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platforms: linux/amd64,linux/arm64
            push: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build revision
        id: revision
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Normalise image name
        id: image
        shell: bash
        run: |
          # Docker image references must be lowercase; GitHub logins are not.
          echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve MA version
        id: version
        shell: bash
        env:
          REQUESTED_MA_VERSION: ${{ inputs.ma_version }}
          FALLBACK_MA_VERSION: ${{ vars.MA_VERSION || '2.10.8' }}
        run: |
          set -euo pipefail
          version="${REQUESTED_MA_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(curl -fsSL --max-time 15 https://api.github.com/repos/music-assistant/server/releases/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))' 2>/dev/null || true)"
          fi
          if [ -z "$version" ]; then
            version="$FALLBACK_MA_VERSION"
          fi
          echo "ma_version=$version" >> "$GITHUB_OUTPUT"
          echo "Using MA base version: $version"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.ma_version }}-bili-${{ steps.revision.outputs.short }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=music-assistant-bili
            org.opencontainers.image.base.name=ghcr.io/music-assistant/server:${{ steps.version.outputs.ma_version }}
            org.opencontainers.image.description=Bilibili video audio provider for Music Assistant (unofficial)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MA_VERSION=${{ steps.version.outputs.ma_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_REF="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Inspecting ${IMAGE_REF}"
          docker buildx imagetools inspect "${IMAGE_REF}" | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt
          grep -q "linux/arm64" /tmp/manifest.txt

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "- Registry: \`${{ steps.image.outputs.name }}\`"
            echo "- MA base: \`${{ steps.version.outputs.ma_version }}\`"
            echo "- Platforms: \`${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.platforms }}\`"
            echo "- Pushed: \`${{ github.event_name != 'pull_request' }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
