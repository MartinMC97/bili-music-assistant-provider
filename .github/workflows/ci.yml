name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Mirrors the checks music-assistant/server runs on a provider: ruff (select ALL +
      # ruff format), mypy in strict mode, codespell and pytest. The tool versions are
      # pinned to the ones used by music-assistant/server 2.10.11 so results match upstream.
      - name: Lint and test (MA 2.10.11)
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh \
            ghcr.io/music-assistant/server:2.10.11 \
            -c "set -eu
              /app/venv/bin/uv pip install -q --python /app/venv/bin/python \
                ruff==0.15.22 mypy==2.3.0 codespell==2.4.3 \
                pytest pytest-asyncio pytest-timeout segno==1.6.6
              /app/venv/bin/ruff check provider tests
              /app/venv/bin/ruff format --check provider tests
              /app/venv/bin/python -m mypy
              /app/venv/bin/codespell provider tests scripts docs README.md README.zh-CN.md
              /app/venv/bin/python scripts/check_provider_conventions.py
              /app/venv/bin/python -m pytest -q"
